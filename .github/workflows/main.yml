name: Build Sonic-MAX APK (Latest)

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2'

      - name: Install GameMaker CLI
        run: npm install -g @gamemaker/gm-cli

      - name: Build Android APK
        env:
          GM_USERNAME: ${{ secrets.GM_USERNAME }}
          GM_PASSWORD: ${{ secrets.GM_PASSWORD }}
        run: |
          gm-cli run --target android --output "./output/sonic-max.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-max-apk
          path: output/sonic-max.apk
